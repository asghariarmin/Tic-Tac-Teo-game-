<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101120">
  <title>Tic Tac Toe · Pixel Arcade</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Pixel Arcade home">
        <span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        PIXEL<span>ARCADE</span>
      </a>
      <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Sound" aria-pressed="true">Sound On</button>
    </header>

    <main class="layout">
      <section class="controls" aria-label="Game controls">
        <h1><span class="visually-hidden">Tic Tac Toe</span><canvas id="title-art" width="46" height="19" aria-hidden="true"></canvas></h1>

        <div id="home-panel" class="panel">
          <h2 class="rule-label">Select mode</h2>
          <div class="modes">
            <button class="mode mode-solo" type="button" data-action="solo">
              <span class="mode-icon" aria-hidden="true"><span class="sprite sprite-bot"></span></span>
              <span class="mode-copy"><strong>Solo</strong><small>Play against the computer</small></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="mode mode-duo" type="button" data-action="duo">
              <span class="mode-icon" aria-hidden="true"><span class="sprite sprite-duo"></span></span>
              <span class="mode-copy"><strong>Two Players</strong><small>Take turns on this device</small></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="mode mode-lan" type="button" data-action="lan">
              <span class="mode-icon" aria-hidden="true"><span class="sprite sprite-lan"></span></span>
              <span class="mode-copy"><strong>Network Play</strong><small>Play with a friend on another device</small></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
          </div>
        </div>

        <div id="solo-panel" class="panel" hidden>
          <h2 class="rule-label" tabindex="-1">Select difficulty</h2>
          <div class="modes">
            <button class="mode mode-solo" type="button" data-level="easy">
              <span class="level-icon" aria-hidden="true"><i></i></span>
              <span class="mode-copy"><strong>Easy</strong><small>Random moves</small></span><span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="mode mode-lan" type="button" data-level="medium">
              <span class="level-icon" aria-hidden="true"><i></i><i></i></span>
              <span class="mode-copy"><strong>Medium</strong><small>Attacks and blocks</small></span><span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="mode mode-duo" type="button" data-level="hard">
              <span class="level-icon" aria-hidden="true"><i></i><i></i><i></i></span>
              <span class="mode-copy"><strong>Hard</strong><small>Plays a perfect game</small></span><span class="arrow" aria-hidden="true">›</span>
            </button>
          </div>
          <button class="text-button" type="button" data-action="back">← Main menu</button>
        </div>

        <div id="lan-panel" class="panel" hidden>
          <h2 class="rule-label" tabindex="-1">Network Play</h2>
          <p class="description">Create a room and share its invite link, or enter a code for a room on this site.</p>
          <button class="primary" id="create-room" type="button" data-action="create">Create Room</button>
          <form id="join-form" class="join-form">
            <label for="room-input">Join with a room code</label>
            <div class="join-row">
              <input id="room-input" name="code" placeholder="ABC234" maxlength="6" required spellcheck="false" autocomplete="off" autocapitalize="characters" aria-describedby="lobby-error">
              <button class="secondary" id="join-room" type="submit">Join</button>
            </div>
          </form>
          <p id="lobby-error" class="error" role="alert" hidden></p>
          <button class="text-button" type="button" data-action="back">← Main menu</button>
        </div>

        <div id="match-panel" class="panel" hidden>
          <h2 id="match-title" class="rule-label" tabindex="-1"></h2>
          <div id="roster" class="roster">
            <div><span class="mark mark-x" aria-hidden="true"></span><span id="player-x"></span></div>
            <div><span class="mark mark-o" aria-hidden="true"></span><span id="player-o"></span></div>
          </div>
          <div id="invite" class="invite" hidden>
            <div class="invite-label">Room code</div>
            <div class="invite-row">
              <output id="room-code"></output>
              <button class="secondary" id="copy-link" type="button" data-action="copy">Copy Invite</button>
            </div>
            <label class="visually-hidden" for="invite-url">Invite link</label>
            <input id="invite-url" type="url" readonly>
            <p id="copy-status" class="hint" aria-live="polite"></p>
          </div>
          <p id="match-error" class="error" role="alert" hidden></p>
          <button id="leave-match" class="text-button" type="button" data-action="leave">← Main menu</button>
        </div>
      </section>

      <section class="cabinet" aria-label="Game board">
        <div class="cabinet-bar">
          <span class="cabinet-name"><span class="pixel-grid" aria-hidden="true"></span> GAME BOARD</span>
          <span id="board-badge" class="badge">STANDBY</span>
        </div>
        <div class="screen">
          <div id="board" class="board" role="group" aria-label="Tic Tac Toe board"></div>
          <div id="particles" class="particles" aria-hidden="true" hidden></div>
        </div>
        <div class="cabinet-footer">
          <div class="status-copy">
            <div id="status" role="status" aria-live="polite" aria-atomic="true">Ready to play</div>
            <div id="status-detail">Choose a mode to start.</div>
          </div>
          <button id="rematch" class="primary replay" type="button" data-action="rematch" hidden>Play Again <span aria-hidden="true">↻</span></button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-legend"><span class="mark mark-x" aria-hidden="true"></span><span class="mark mark-o" aria-hidden="true"></span> THREE IN A ROW TO WIN</div>
      <div class="keyboard-hint"><kbd>Tab</kbd> move <kbd>Enter</kbd> select</div>
    </footer>
  </div>
</body>
</html>
